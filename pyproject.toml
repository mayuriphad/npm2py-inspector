[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "npm2py-inspector"
version = "0.1.0"
description = "Static health checker for NPM, React, and TypeScript projects."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Mayuri", email = "mayuriphad656@gmail.com"}
]
dependencies = []

[project.scripts]
npm2py-inspector = "cli:main"

[tool.setuptools]
py-modules = ["engine", "checks", "cli"]
